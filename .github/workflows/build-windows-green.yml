# Windows 绿色版（免安装）— GitHub Actions
name: Build Windows Green

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-green:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      npm_config_msvs_version: '2022'
      GYP_MSVS_VERSION: '2022'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3,uiohook-napi,active-win

      - name: Build portable + zip (green)
        run: npm run dist:win:green
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Artifacts 配额常满；改传到 GitHub Release（不覆盖 NSIS 的 latest.yml）
      - name: Publish green packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}"
          shopt -s nullglob
          ASSETS=(release/*绿色版*.exe release/*.zip)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No green exe/zip found"
            ls -lah release/ || true
            exit 1
          fi
          ls -lah "${ASSETS[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "即刻对话 ${TAG}" \
              --notes "Windows portable + zip (x64)." \
              --latest=false
          fi
