# 在 GitHub 云端 Windows 上打 NSIS 安装包（本机无需 Windows）
name: Build Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'electron.vite.config.ts'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    # windows-latest 现为 VS 2025，旧 node-gyp 认不出；用 2022
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      npm_config_msvs_version: '2022'
      GYP_MSVS_VERSION: '2022'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3,uiohook-napi,active-win

      - name: Build Windows installer
        # --publish never：只出包上传 Artifact，不发 GitHub Release
        run: npm run dist:win
        env:
          # 未签名内测包即可；有证书时再配 WIN_CSC_*
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: typenow-windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
          retention-days: 14
