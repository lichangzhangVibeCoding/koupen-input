# 在 GitHub 云端 Windows 上打 NSIS 安装包（本机无需 Windows）
name: Build Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'electron.vite.config.ts'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  windows:
    # windows-latest 现为 VS 2025，旧 node-gyp 认不出；用 2022
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      npm_config_msvs_version: '2022'
      GYP_MSVS_VERSION: '2022'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3,uiohook-napi,active-win

      - name: Build Windows installer
        # --publish never：只出包，不走 electron-builder publish
        run: npm run dist:win
        env:
          # 未签名内测包即可；有证书时再配 WIN_CSC_*
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}

      # Actions Artifact 配额常满；改传到 GitHub Release（存储配额独立）
      - name: Publish installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}"
          shopt -s nullglob
          ASSETS=(release/*.exe release/*.yml)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release/*.exe or release/*.yml found"
            ls -lah release/ || true
            exit 1
          fi
          ls -lah "${ASSETS[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "即刻对话 ${TAG}" \
              --notes "Windows NSIS installer (x64). Built by CI for testing." \
              --latest=false
          fi

      - name: Upload installer artifact (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: typenow-windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
          retention-days: 7
