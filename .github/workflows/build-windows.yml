# 在 GitHub 云端 Windows 上打 NSIS 安装包（本机无需 Windows）
name: Build Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'electron.vite.config.ts'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3,uiohook-napi,active-win

      - name: Build Windows installer
        run: npm run dist:win
        env:
          # 未签名内测包即可；有证书时再配 WIN_CSC_*
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: koupen-windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
          retention-days: 14
